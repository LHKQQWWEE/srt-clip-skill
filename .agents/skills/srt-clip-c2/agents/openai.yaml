interface:
  display_name: "直播切片文案 C2 0.2.19"
  short_description: "按要求编排单方案或多方案商品亮点"
  default_prompt: "按 C2 0.2.19 的 SKILL.md 执行。默认生成一条覆盖全部归属明确亮点的完整方案；用户明确要求多条但未给数量时先询问，指定数量后按要求生成且最多三条。开头优先选择最能引起共鸣的商品相关顾客困扰，没有合适困扰再选核心卖点；主播尺码建议不等于顾客困扰。平台明确指出材质字幕违规时删除整条字幕，其他字幕逐条判断。逐版记录侧重点和亮点取舍；每版给3个生成话题和固定话题#穿搭、#时尚营销；五部分输出，所有方案序号放在同一代码框中并以空行分隔。"
