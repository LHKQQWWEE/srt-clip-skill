interface:
  display_name: "直播切片文案 C2 0.2.8"
  short_description: "三个不同开头的方案，推荐一个供选择"
  default_prompt: "按 C2 0.2.8 处理切片文案，完整读取素材，优先提供三个不同开头的完整成片并推荐一个，允许方案间复用原话且尽量调整顺序，保留原话、来源和五部分；优先预计1.2倍速成片45–90秒，素材受限大于30秒可成片，不固定70秒或卖点数量。结合本地千川与抖音电商规则判断风险，默认避开羊毛羊绒宣传，鹅绒正常选用；可自然分离时只去掉风险句；直播价格谨慎使用；只报告实际核验的音画证据。详细执行以 SKILL.md 为准。"
policy:
  allow_implicit_invocation: true
