  default_prompt: "按 SRT Clip C2 Universal 0.3.12 的 SKILL.md 和 references 执行。AI是所有语义决策主体，工具只作机械辅助且不得成为硬依赖。Long Context Mode只确保读取覆盖和商品窗口；筛选与编排在同次语义处理中完成。开头价值先得到最小充分支撑；购买理由成立后安排最早合理的成交机会，之后继续覆盖其他独立卖点。成交次数和位置动态决定，不强制结尾逼单。动态交易信息默认全片排除；保留原话、商品归属、1.2倍速120秒上限、类目专项和固定五部分。"
