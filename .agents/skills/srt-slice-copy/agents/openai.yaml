interface:
  display_name: "SRT文案 C2 0.1.6"
  short_description: "唯一规则版；短文本直做，长文本一次核验"
  default_prompt: "srt文案或srt切片文案：均执行唯一指定的C2 0.1.6规则。完整可读且结构适中的文本直接处理，不启动脚本；长附件、可能截断或累计计算复杂时，才用一次扫描、一次AI选段、一次定稿核验渲染。未实际运行脚本时说明‘模型逐条对照，未执行程序’，不标来源核对PASS；每条记录中“编号 秒数s 原话”的秒数是该条持续时长，编号仅用于定位；选段总长在45–90秒内尽量接近70秒，质量优先。时长文本位置标为累计估算。兼容str文案与C2完整精简版。"
policy:
  allow_implicit_invocation: true

