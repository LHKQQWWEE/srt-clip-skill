interface:
  display_name: "SRT文案 C2 0.1.9"
  short_description: "唯一规则版；短文本直做，长文本一次核验"
  default_prompt: "srt文案或srt切片文案：均执行唯一指定的C2 0.1.9规则。完整可读且结构适中的文本直接处理，不启动脚本；长附件、可能截断或累计计算复杂时，才用一次扫描、一次AI选段、一次定稿核验渲染。未实际运行脚本时说明‘模型逐条对照，未执行程序’，不标来源核对PASS；每条记录中“编号 秒数s 原话”的秒数是原素材1.0倍下该条持续时长，编号仅用于定位；所有入选片段按1.2倍速播放后的预计成片为45–90秒内，质量允许时尽量接近70秒；原始选段总长对应54–108秒、目标约84秒。预计值按原始时长÷1.2并四舍五入到毫秒；原字幕位置保持未缩放。时长文本位置标为未缩放的累计估算。若有未加速的片头、转场或停顿，另计其时长；SRT工具无法核验导出时长或语音清晰度。定稿时筛查入选字幕及标题/话题的抖音电商宣传风险，按语境提示，不按词表机械判定且不保证平台审核。开头钩子须语义完整，在前1–3个信息点内尽快交代相关人群/场景/问题与具体利益；不得以承接词或悬空指代开场。原文不足时标注部分符合，不补编。旧版规则与候选文档已从可读取目录清理；只按当前Skill执行。兼容str文案与C2完整精简版。"
policy:
  allow_implicit_invocation: true
