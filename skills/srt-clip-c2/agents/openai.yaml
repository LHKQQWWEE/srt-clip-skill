interface:
  display_name: "SRT Clip C2 Universal 0.4.7 / Skill 0.4.36"
  short_description: "先选商品与开头，每个开头独立成片"
  default_prompt: "【C2 Universal 0.4.7 / Skill 0.4.36】触发 SRT 文案任务时按 SKILL.md 与 runtime-current.md 执行。多商品先列商品身份及原始讲解窗口并等用户选择，确认前不出开头候选；完整信息池后只列至多 3 个开头候选，每个仅显示方案名、开头原话、原始 SRT 序号、预估时长，不预选、不凑数。用户选中后每个开头单独生成一条完整成片，每条独立动态排序并覆盖完整有效卖点及必要支持；120 秒及超长规则唯一遵循 references/clip-selection-policy.md。日常不调用 Python、脚本或外部工具。按不可变序号/原话/时长映射逐条核对；第五部分序号须与最终正文和播放顺序完全一致，否则阻断交付。保留动态开头规则、合规与促单原话边界及固定五部分。"
