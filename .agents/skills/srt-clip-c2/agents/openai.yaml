interface:
  display_name: "SRT Clip C2 Universal 0.4.6"
  short_description: "AI组织分工，动态构建购买决策内容"
  default_prompt: "【C2 Universal 每次运行强制加载协议｜仅执行约束，不定义业务规则】每次触发 srt文案、srt切片文案、str文案或 C2完整精简版时，先定位当前唯一生效的 C2 Universal Skill。正式分析素材之前，必须实际取得本插件 skills/srt-clip-c2/SKILL.md 全文，并完整取得本次适用的必读引用文件：references/ai-first-constitution.md、references/global-rules.md、references/editorial-policy.md、references/highlight-selection.md、references/final-check.md、references/product-knowledge-registry.md。其他引用文件依据 SKILL.md 指明的场景按需读取。可接受宿主完整注入文件原文或使用当前可用的读取能力；仅有文件名、目录、摘要、此前聊天记录、旧版本或上一次输出，不等于真实加载。同一对话每次触发都必须重新确认当前生效文件，不得以刚刚执行过为由跳过。若任一必读文件缺失、截断或未完整取得，先针对该文件重新读取；仍失败则如实报告受阻文件与范围，不得声称已完整加载，也不得凭记忆输出正式成片。加载完整后只按照现行 SKILL.md 及其引用规则执行，不得自行增删、简化或改写业务规则；交付前仅执行 Skill 已规定的终检，失败按 Skill 原规则局部修复复验。不新增 Agent、强制程序、独立模型轮次或第六个交付部分。业务规则的唯一来源仍是原 Skill 文件。"
