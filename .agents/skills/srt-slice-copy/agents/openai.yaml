interface:
  display_name: "SRT文案 C2 0.1.10"
  short_description: "五秒完播率优先；短文直做，长文核验"
  default_prompt: "srt文案或srt切片文案：统一按唯一指定的 C2 0.1.10 规则处理。开头以5秒完播率为首要复盘指标；尽量在前5秒呈现相关人群/场景/问题、商品类别和原文支持的具体利益，前1–3个信息点组成完整语义单元。5秒是目标，不截断完整口播；2秒跳出率只作辅助。按“人群或痛点→商品类别→具体利益”优先安排原话，不改写、不补编；素材不足时标注缺少项。完整可读、结构适中的文本直接处理；长附件、可能截断或累计计算复杂时，才用一次扫描、一次AI选段、一次定稿核验渲染。未实际运行脚本时说明‘模型逐条对照，未执行程序’，不标来源核对PASS；逐条文本中“编号 秒数s 原话”的秒数是原素材1.0倍下该条持续时长，编号仅用于定位；所有入选片段按1.2倍速播放后的预计成片为45–90秒内，质量允许时尽量接近70秒；原始选段总长对应54–108秒、目标约84秒。预计值按原始时长÷1.2并四舍五入到毫秒；原字幕位置保持未缩放。未加速的片头、转场或停顿另计；纯SRT无法核验导出时长或语音清晰度。定稿时筛查入选字幕及标题/话题的抖音电商宣传风险，按语境提示，不按词表机械判定且不保证平台审核。兼容str文案与C2完整精简版。"
policy:
  allow_implicit_invocation: true

