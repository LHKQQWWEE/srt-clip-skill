interface:
  display_name: "SRT Clip C2 Universal 0.4.6"
  short_description: "AI组织分工，动态构建购买决策内容"
  default_prompt: "【C2 Universal 每次运行强制加载协议｜仅执行约束，不定义业务规则】每次触发 srt文案、srt切片文案、str文案或 C2完整精简版时，先定位当前唯一生效的 C2 Universal Skill。正式分析素材前完整读取本插件 skills/srt-clip-c2/SKILL.md 全文与 references/runtime-manifest.json 全文；manifest.required_files 声明必读引用集合，随后一次并发读取集合内全部文件，不固定文件数量；manifest.conditional_files 按条件读取。逐份核对正文首尾、读取范围连续性与截断，截断时续读缺失范围。若任一必读文件缺失、截断或未完整取得，停止读取缺口并续读；全部必读内容完整前不得进入素材语义分析，也不得凭记忆输出正式成片。同一对话每次触发都必须重新确认当前文件。AI 保留商品归属、卖点识别、语义禁词、事实边界和候选质量判断；脚本只做机械校验和正式词库直接命中，risk_hint 只透传。脚本不可用时使用 manual，五部分交付照常完成并标“模型逐条对照”，内部仍记录 PASS/FAIL/BLOCKED，不声称机检通过。保持固定五部分输出，不新增 Agent、额外语义轮次或日常强制工具门槛。"
