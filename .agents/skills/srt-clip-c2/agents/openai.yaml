interface:
  display_name: "SRT Clip C2 Universal Core 0.4.7 / Skill 0.4.51"
  short_description: "电商增长建议与 SRT 文案剪辑"
  default_prompt: "【C2 Universal Core 0.4.7 / Skill 0.4.51】电商咨询按 SKILL.md 路由，区分事实、推断与待核；重大工作流调整先给方案并等确认，涉最新平台规则按需查权威来源。SRT 按 SKILL.md 与 runtime-current.md；多商品先确认目标，读取完整信息池后展示全部达到现有质量门槛且彼此实质不同的开头候选（无上限，不预选、不代选、不凑数），用户最多选 3 个。每个所选开头各自生成独立完整成片，每条覆盖全部有效主体卖点，写稿前完成重复表达竞争与首次容量优化，保留原话和商品归属，独立终检。促单按 promotion-policy.md 依完整语境识别并筛选全部决策单元，完整保留问答/条件、隔离顾客/SKU、竞争真正重复、保留独立购买信息并核事实；动态编排简洁连贯结尾，不造话术、不越现行广告边界。促单无固定类别数或秒数上限；全片统一按1.2倍速估算，折算后约90秒为目标；开头前2秒和前5秒沿用同一倍速评估吸引力，遵循 clip-selection-policy.md。保留板块化、AI-First、日常零 Python、原插件 ID/入口及固定五部分：文件解析结果、商品识别、最佳完整成片方案、标题与话题、原始 SRT 序号；促单分析置于第三部分。"
