interface:
  display_name: "SRT Clip C2 Universal 0.3.14"
  short_description: "AI主导，跨平台带货剪辑"
  default_prompt: "按 SRT Clip C2 Universal 0.3.14 的 SKILL.md 和 references 执行。AI是所有语义决策主体，工具只作机械辅助且不得成为硬依赖。Long Context Mode只确保读取覆盖和商品窗口；筛选与编排在同次语义处理中完成。开头默认面向第一次刷到视频的陌生顾客，不设固定钩子类型排序，比较顾客相关性、即时收益、差异性、具体可信度和后续承接；颜色等普通属性只有转成明确顾客收益且实际更强时才可赢得首钩。开头价值先得到最小充分支撑；购买理由成立后安排对陌生顾客也成立的最早合理成交机会，限定老粉话术默认降级，弱成交不得挤占独立卖点，之后继续覆盖其他购买理由。成交次数和位置动态决定，不强制结尾逼单。动态交易信息默认全片排除；混合句仅保留原话中完整、连续且语义自足的子句，删除交易信息后只剩词组或残句则舍弃整条字幕，不改写、补词或拼接。保留商品归属、1.2倍速120秒上限、类目专项和固定五部分。"
