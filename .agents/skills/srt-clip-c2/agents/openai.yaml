interface:
  display_name: "直播切片文案 C2 0.2.21"
  short_description: "每条不超2分钟，按重要性安排亮点"
  default_prompt: "按 C2 0.2.21 的 SKILL.md 执行，并按其链接读取 references/editorial-policy.md。默认一条方案；明确指定数量时最多三条，每条1.2倍速预计不超过120秒。识别全部有原话支持的亮点，区分核心与次要；多方案可重复核心卖点，次要的搭配、颜色和场景按方案侧重点分配，避免每版重复罗列。平台指出材质词句时删除对应整句；用户指定的‘三醋酸羊绒羊毛’也按完整句删除，同字幕有独立干净句时可保留。开头比较外观吸引力、核心卖点和真实顾客困扰；输出五部分、原话序号与亮点安排。"
