interface:
  display_name: "直播切片文案 C2 0.2.2"
  short_description: "MP4/SRT统一处理；五部分交付"
  default_prompt: "切片文案、srt文案、srt切片文案、str文案或C2完整精简版：统一按 C2 0.2.2 唯一规则处理。支持SRT、逐条时长文本、MP4+SRT及MP4-only。MP4+SRT以SRT作文本/编号来源，只核验最终候选和歧义区间；MP4-only仅在当前宿主实际可读取口播与画面时处理，不伪造SRT序号或时间，能力不足时请求SRT。“编号 秒数s 原话”或“编号 秒数 原话”中，s后缀可省略，秒数是原素材1.0倍下该条持续时长，编号仅用于定位。所有入选片段按1.2倍速播放后的预计成片为45–90秒，质量允许时尽量接近70秒；原始选段对应54–108秒、目标约84秒。估算为原始时长÷1.2，毫秒四舍五入且半毫秒向上；原始字幕定位不缩放。未加速的片头、转场或停顿需另计。完整可读、结构适中的文本直接处理；长附件、可能截断或累计计算复杂时，对附件/不完整显示的输入使用一次完整清单扫描和同快照分页；只有本轮消息中完整可见且确认未截断的粘贴文本才使用 --summary，仍会完整解析并保存快照、仅隐藏逐条扫描输出。候选语义判断时顺手识别广告极限词、绝对效果保证、材质/功效/价格/折扣/库存及紧迫表述等风险；定稿时仅复核入选字幕及标题/话题，按语境区分风险与需证据核实项，不把关键词命中当作违规结论。五部分格式不变，第一部分末尾简要报告筛查结果。未实际执行脚本时说明“模型逐条对照，未执行程序”，不得标记来源核对PASS。兼容 str文案 与 C2完整精简版。 开头优化以抖音数据中心的“5秒完播率”为首要复盘指标；“2秒跳出率”等只作辅助。“前5秒”一律指最终成片按观众实际播放时间计算的前5秒，不按原素材1.0倍计时；开头口播统一1.2倍速时约对应原素材前6秒，未加速片头、转场和停顿按实际播放时长计入；SRT时间码和逐条时长仍按原素材1.0倍口径。尽量在最终成片前5秒呈现相关人群/场景/问题、商品类别和原文支持的具体利益，并用前1–3个信息点组织成自足完整的语义单元。5秒是优化目标，不截断完整口播；自然口播超出时保留完整原话并优先前置痛点或利益。不得以承接词或悬空指代开场，素材不足时标注部分符合、不补编。用户提供作品数据时参考同账号相近题材和时长，不设通用及格线；前5秒流失时检查开头，之后流失时检查中段，不把单项指标当作流量保证。 开头不得以“而且/但是/然后/所以”等承接词或无先行词的“这个/它”起头。 所有触发词与输入模式均使用这一套C2规则；旧版、外部副本或缓存内容不构成第二条活动路由。 长附件、截断风险或复杂累计文本直接对原件运行一次 scan/scan-text，不先打印全文；截断时从同一快照分页。商品目标已指定就不追问。完整读完后做一轮语义筛选，比较会影响商品/来源准确、开头、理由多样性、衔接、CTA、合规或时长的候选；不得在第一个时长合格方案处停止，也不穷举组合。完成全部质量与时长检查后冻结；素材缺少钩子或CTA时标明缺项。只有目标变更、来源/输入错漏、明确质量失败或渲染器报具体错误才重开。字段结构见Skill中的六键plan模板，冻结后再渲染。"
policy:
  allow_implicit_invocation: true


