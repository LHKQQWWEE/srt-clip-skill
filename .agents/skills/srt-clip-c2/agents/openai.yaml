interface:
  display_name: "直播切片文案 C2 0.2.20"
  short_description: "按吸引力挑开头并完整保留亮点"
  default_prompt: "按 C2 0.2.20 的 SKILL.md 执行，并按其链接读取 references/editorial-policy.md。默认一条完整方案，明确指定数量时最多三条；每版覆盖全部归属明确、有原话支持的不同亮点。开头比较好看类外观吸引力、商品核心卖点和真实顾客困扰，不固定困扰优先，也不按商品品类排除顾客困扰。平台指出材质词句违规时删除对应整句；同字幕有独立干净句时，成片原话只显示保留句，违规句只列于素材例外。每版给三个生成话题及固定话题#穿搭、#时尚营销；输出五部分和原话序号。"
