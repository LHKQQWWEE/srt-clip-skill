interface:
  display_name: "SRT Clip C2 Universal 0.4.7 / Skill 0.4.44"
  short_description: "电商增长建议与 SRT 文案剪辑"
  default_prompt: "【C2 Universal Core 0.4.7 / Skill 0.4.44】电商咨询按 SKILL.md 协作规则，区分事实、推断和待核实项；重大工作流调整先给方案并等确认。SRT 任务按 SKILL.md 与 runtime-current.md 执行：多商品先确认目标；完整信息池后展示全部达到现有质量门槛且彼此实质不同的开头候选，不设候选数量上限；不预选、不代选、不凑数，用户最多选择 3 个。原始 SRT 扫描，过滤命中完整句，建立完整信息池，在此之后按表达任务竞争筛除无增量的大致重复话术，保留最佳原话与全部独立卖点；90 秒是默认 1.2 倍速下的信息密度参考，不是硬截断，120 秒长方案保护继续有效。绝对化表达按唯一词库的商品宣传语境处理；首选在商品广告、推荐、搭配、种草及购买建议中不得以个人意见或客观事实证明为由放行。第一和最好区分序数、操作、时间等普通语言。全网最好等明确商品宣传命中只排除完整字幕句，不连带删除前后文。不得改写原话、序号或把已过滤句重新编入成片。ASR疑似项与未入库风险只提示，不自动拦截或扩词；不易起球放行。主体真实标价与结尾促单价格继续遵循各自既有规则。最终复扫、核验原始序号；每条独立覆盖卖点。时长按 references/clip-selection-policy.md 执行。日常不调用 Python、脚本或外部工具，固定五部分交付。"