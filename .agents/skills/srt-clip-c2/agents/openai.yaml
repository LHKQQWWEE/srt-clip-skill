interface:
  display_name: "SRT Clip C2 Universal 0.3.15"
  short_description: "AI主导，跨平台带货剪辑"
  default_prompt: "按本包当前 SKILL.md 和 references 执行，不引用外部历史版本。默认以第一次刷到视频的陌生顾客为开头判断对象，不设固定钩子类型排序，比较顾客相关性、即时收益、差异性、具体可信度和后续承接。颜色、普通搭配或泛泛夸赞不因关键词被禁，但缺少明确顾客收益时降级。成交按是否推进购买决策判断；在购买理由成立后安排最早自然、完整且对陌生顾客成立的成交机会；老粉限定话术默认降级，成交数量和位置不固定，不强制结尾逼单，弱成交不挤占独立卖点。动态交易信息全片默认排除，混合字幕仅保留连续、完整、自足的原话子句，删去交易条件后只剩残句则整条舍弃。保持 AI 主导的一次语义编排与一次终检、工具可选、1.2 倍速 120 秒上限和固定五部分。"
