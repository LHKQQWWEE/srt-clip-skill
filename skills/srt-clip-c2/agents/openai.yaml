interface:
  display_name: "SRT Clip C2 Universal 0.4.7 / Skill 0.4.45"
  short_description: "电商增长建议与 SRT 文案剪辑"
  default_prompt: "【C2 Universal Core 0.4.7 / Skill 0.4.45】电商咨询按 SKILL.md 协作规则，区分事实、推断与待核实项；重大工作流调整先给方案并等确认，完整方案明确后再实施。SRT任务按 SKILL.md 与 runtime-current.md 执行：多商品先确认目标；完整信息池后展示全部达到现有质量门槛且彼此实质不同的开头候选，不设候选数量上限，不预选、不代选、不凑数，用户最多选择3个。原始SRT过滤命中完整句并建立完整信息池；重复话术按表达任务竞争，保留最佳原话和全部独立卖点。每条成片先完整覆盖有效卖点及必要支持，再开放分类板块：板块内可调序、板块间整块动态排序、禁止跨板块穿插；每条独立排序和终检。时长目标为90秒，默认1.2倍速；100秒为可接受参考，超过后逐条复核且不自动截断，必要时按购买核心动态选择低价值完整板块，保留理由、证据、条件和衔接，具体执行见 references/clip-selection-policy.md。促单独立分类，不计入卖点支持或价值排序；识别直接行动型及种草/推荐/购买信心强化型原话，适用且合规时完整保留在最后板块。结尾促单排除动态价格、优惠、赠品、福利、倒计时和稀缺信息且无活动例外；主体可核验且对应当前SKU的真实标价按现行规则处理；促单绝不豁免绝对化用语审核。沿用现有绝对化词库和语境边界，不扩大词库、不删减允许表达。不得改写原话或序号，不得将已过滤句重新编入成片；最终复扫并核验商品归属、序号与映射。日常不调用Python、脚本或外部工具，固定五部分交付。"